version: 2.1

orbs:
  node: circleci/node@7.2.1
  sonarcloud: sonarsource/sonarcloud@4.0.0

commands:
  # cimg/node (Node 25+) does not ship corepack. Install it into ~/.local (user-owned
  # and on PATH in cimg images) so no sudo is needed; the node orb's yarn-berry
  # install script then runs `corepack enable`, writing shims to ~/.local/bin.
  install-deps:
    steps:
      - run:
          name: Install corepack
          command: command -v corepack || npm install -g --prefix ~/.local corepack
      - node/install-packages:
          pkg-manager: yarn-berry

jobs:
  lint-and-typecheck:
    docker:
      - image: cimg/node:lts
    steps:
      - checkout
      - install-deps
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn format:check

  test:
    docker:
      - image: cimg/node:lts
    steps:
      - checkout
      - install-deps
      - run: yarn test:coverage
      - persist_to_workspace:
          root: .
          paths:
            - coverage

  sonar-scan:
    docker:
      - image: cimg/node:lts
    steps:
      - checkout
      - attach_workspace:
          at: .
      - sonarcloud/scan

  build:
    docker:
      - image: cimg/node:lts
    steps:
      - checkout
      - install-deps
      - run: yarn build

workflows:
  ci:
    jobs:
      - lint-and-typecheck
      - test
      - sonar-scan:
          requires:
            - test
          context: SonarCloud
      - build:
          requires:
            - lint-and-typecheck
            - test
