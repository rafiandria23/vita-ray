version: 2.1

orbs:
  node: circleci/node@7.2.1
  sonarcloud: sonarsource/sonarcloud@4.0.0

commands:
  install-deps:
    steps:
      - run:
          name: Enable corepack
          command: corepack enable
      - node/install-packages:
          pkg-manager: yarn-berry

jobs:
  lint-and-typecheck:
    docker:
      - image: cimg/node:lts
    steps:
      - checkout
      - install-deps
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn format:check

  test:
    docker:
      - image: cimg/node:lts
    steps:
      - checkout
      - install-deps
      - run: yarn test:coverage
      - persist_to_workspace:
          root: .
          paths:
            - coverage

  sonar-scan:
    docker:
      - image: cimg/node:lts
    steps:
      - checkout
      - attach_workspace:
          at: .
      - sonarcloud/scan

  build:
    docker:
      - image: cimg/node:lts
    steps:
      - checkout
      - install-deps
      - run: yarn build

workflows:
  ci:
    jobs:
      - lint-and-typecheck
      - test
      - sonar-scan:
          requires:
            - test
          context: SonarCloud
      - build:
          requires:
            - lint-and-typecheck
            - test
